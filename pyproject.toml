[project]
name = "small-object-detection"
version = "0.1.0"
description = "Small Object Detection benchmark and ablation suite for AI-TOD-v2"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ultralytics>=8.3.0",
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "sahi>=0.11.18",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pyyaml>=6.0.1",
    "scikit-learn>=1.4.0",
    "matplotlib>=3.8.0",
    "opencv-python>=4.9.0",
    "gdown>=6.4.2",
    "seaborn>=0.13.2",
    "pandas>=2.3.3",
]

[project.scripts]
sod = "src.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
ignore = ["B008"]
